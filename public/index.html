<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BongoBot &middot; Achievements &amp; Roles</title>
  <link rel="stylesheet" href="/dist/output.css" />
</head>
<body class="h-full bg-white dark:bg-gray-900">
  <div class="min-h-full">
    <nav class="border-b border-gray-200 bg-white dark:border-white/10 dark:bg-gray-900">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center">
          <span class="text-lg font-semibold text-gray-900 dark:text-white">BongoBot</span>
        </div>
      </div>
    </nav>

    <div class="py-10">
      <header>
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Achievements &amp; Roles</h1>
        </div>
      </header>
      <main>
        <div class="mx-auto max-w-7xl space-y-10 px-4 py-8 sm:px-6 lg:px-8">

          <!-- Summary stats -->
          <section id="summary-stats">
            <dl class="grid grid-cols-1 gap-5 sm:grid-cols-2">
              <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm sm:p-6 dark:bg-gray-800/75 dark:inset-ring dark:inset-ring-white/10">
                <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Achievements</dt>
                <dd id="stat-achievements" class="mt-1 text-3xl font-semibold tracking-tight text-gray-900 dark:text-white">&hellip;</dd>
              </div>
              <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm sm:p-6 dark:bg-gray-800/75 dark:inset-ring dark:inset-ring-white/10">
                <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Discord Roles</dt>
                <dd id="stat-roles" class="mt-1 text-3xl font-semibold tracking-tight text-gray-900 dark:text-white">&hellip;</dd>
              </div>
            </dl>
          </section>

          <!-- Achievements -->
          <section id="achievements-section">
            <div class="sm:flex sm:items-center sm:justify-between">
              <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Achievements</h2>
              <div class="mt-3 sm:mt-0">
                <label for="category-filter" class="sr-only">Filter by category</label>
                <div class="grid grid-cols-1">
                  <select id="category-filter" class="col-start-1 row-start-1 w-full min-w-48 appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-sm text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-indigo-600 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:*:bg-gray-800 dark:focus-visible:outline-indigo-500">
                    <option value="">All categories</option>
                  </select>
                  <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-4 self-center justify-self-end text-gray-500 dark:text-gray-400">
                    <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
                  </svg>
                </div>
              </div>
            </div>
            <div class="mt-4 overflow-hidden rounded-lg bg-white shadow-sm dark:bg-gray-800/50 dark:shadow-none dark:outline dark:-outline-offset-1 dark:outline-white/10">
              <div class="px-4 py-5 sm:p-6">
                <div id="achievements-loading" class="py-8 text-center text-sm text-gray-500 dark:text-gray-400">Loading achievements&hellip;</div>
                <div id="achievements-error" class="hidden py-8 text-center text-sm text-red-600 dark:text-red-400"></div>
                <div id="achievements-empty" class="hidden text-center">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" class="mx-auto size-12 text-gray-400 dark:text-gray-500">
                    <path d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <h3 class="mt-2 text-sm font-semibold text-gray-900 dark:text-white">No achievements</h3>
                  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">There are no achievements to show yet.</p>
                </div>
                <div id="achievements-table-wrapper" class="hidden -mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
                  <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
                    <table class="relative min-w-full">
                      <thead class="bg-white dark:bg-gray-900">
                        <tr>
                          <th scope="col" class="py-3.5 pr-3 pl-4 text-left text-sm font-semibold text-gray-900 sm:pl-3 dark:text-white">Achievement</th>
                          <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 dark:text-white">Category</th>
                          <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 dark:text-white">Discord Role</th>
                        </tr>
                      </thead>
                      <tbody id="achievements-table-body" class="bg-white dark:bg-gray-900"></tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Discord roles -->
          <section id="roles-section">
            <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Discord Roles</h2>
            <div class="mt-4 rounded-lg bg-white px-4 py-4 shadow-sm sm:px-6 dark:bg-gray-800/50 dark:shadow-none dark:outline dark:-outline-offset-1 dark:outline-white/10">
              <div id="roles-loading" class="py-8 text-center text-sm text-gray-500 dark:text-gray-400">Loading roles&hellip;</div>
              <div id="roles-error" class="hidden py-8 text-center text-sm text-red-600 dark:text-red-400"></div>
              <div id="roles-empty" class="hidden text-center py-8">
                <h3 class="text-sm font-semibold text-gray-900 dark:text-white">No roles</h3>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">There are no roles to show yet.</p>
              </div>
              <ul id="roles-list" role="list" class="hidden divide-y divide-gray-100 dark:divide-white/5"></ul>
            </div>
          </section>

        </div>
      </main>
    </div>

    <footer class="mx-auto max-w-7xl px-4 py-6 text-center text-sm text-gray-500 sm:px-6 lg:px-8 dark:text-gray-400">
      &copy; BongoBot
    </footer>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
